name: Build APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "dist/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Tasker-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Commit APK to branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Tasker.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Tasker.apk
          git commit -m "Build Tasker.apk from ${GITHUB_SHA::7} [skip ci]" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
